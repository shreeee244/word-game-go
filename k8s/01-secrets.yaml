apiVersion: v1
kind: Secret
metadata:
  name: word-game-secrets
  namespace: word-game
type: Opaque
stringData:
  POSTGRES_USER: wordgame
  POSTGRES_PASSWORD: wordgame
  POSTGRES_DB: wordgame
  DATABASE_URL: postgres://wordgame:wordgame@postgres:5432/wordgame?sslmode=disable
  REDIS_URL: redis://redis:6379/0
