apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: word-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: word-game-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: word-game-secrets
          command:
            - sh
            - -c
            - |
              until psql -h postgres -U wordgame -d wordgame -c "SELECT 1 FROM words LIMIT 1" > /dev/null 2>&1; do
                echo "waiting for migrations to complete..."
                sleep 2
              done
              echo "schema is ready"
      containers:
        - name: app
          image: shrustieeepatil/daily-word-game:1.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: word-game-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: word-game
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080